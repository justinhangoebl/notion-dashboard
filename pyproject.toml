[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phd-notion-dashboard"
description = "Always-on-top desktop dashboard for a Notion calendar and TODO list, with clock in/out and voice notes."
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "PyQt6>=6.7",
    "notion-client>=3.1.0",
    "python-dotenv>=1.0.1",
    "PyYAML>=6.0.2",
    "tzdata>=2025.2",
    # Global hotkeys on Linux/X11
    "python-xlib>=0.33; sys_platform == 'linux'",
]

[project.optional-dependencies]
# Voice notes. The dashboard works without these.
voice = [
    "faster-whisper>=1.1",
    "sounddevice>=0.5",
    "numpy>=1.26",
]

[project.gui-scripts]
notion-dashboard = "notion_dashboard.app:main"

[tool.setuptools.dynamic]
version = { attr = "notion_dashboard.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
notion_dashboard = ["assets/*.png", "assets/*.ico", "assets/*.svg", "assets/fonts/*"]
